<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>HaloChats</title>
    <script>
      const repo = "/HaloChats";

      let path = window.location.pathname;

      if (path.startsWith(repo)) {
        path = path.substring(repo.length);
      }

      const redirectUrl =
        repo +
        "/index.html" +
        "?redirect=" +
        encodeURIComponent(path + window.location.search + window.location.hash);

      window.location.replace(redirectUrl);
    </script>
  </head>

  <body>
    Loading HaloChats...
  </body>
</html>
