name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # Checkout source code
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------
      # Setup Node.js
      # --------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # --------------------------------
      # Configure GitHub Pages
      # --------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --------------------------------
      # Install dependencies
      # --------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------
      # Build Vite frontend
      # --------------------------------
      - name: Build
        run: npm run build
        env:
          PROD: ${{ vars.PROD }}
          VITE_API_HOST: ${{ vars.VITE_API_HOST }}
          VITE_API_PORT: ${{ vars.VITE_API_PORT }}
          VITE_SQL_WASM_URL: ${{ vars.VITE_SQL_WASM_URL }}
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}

      # --------------------------------
      # Create SPA fallback
      # --------------------------------
      - name: Copy 404.html
        run: cp dist/index.html dist/404.html

      # --------------------------------
      # Upload dist to GitHub Pages
      # --------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # --------------------------------
      # Deploy to GitHub Pages
      # --------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4